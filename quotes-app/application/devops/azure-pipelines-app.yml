name: '$(Rev:r)'

variables:
  tag: $(Build.BuildNumber)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - quotes-app/application/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - quotes-app/application/**

pool:
  name: 'test'

parameters:
  - name: dev_env
    type: object
    default:
      - name: dev
        timeoutInMinutes: 30
        triggerBranch: main
        tagPrefix: "1.0."
        azureServiceConnection: sc-1
        appServiceName: quotesapp-appsvc-dev-h3h4qv
        resourceGroupName: quotesapp-rg-dev-h3h4qv
        appServiceSlot: production
        nodeVersion: 18.x
        workingDirectory: $(System.DefaultWorkingDirectory)/quotes-app/application
        environment: quotes-app-dev
        healthCheckRetries: 10
        healthCheckDelay: 20
        runSmokeTests: true
        notifyOnFailure: true

  - name: prod_env
    type: object
    default:
      - name: production
        timeoutInMinutes: 30
        triggerBranch: main
        tagPrefix: "1.0."
        azureServiceConnection: sc-1
        appServiceName: quotesapp-appsvc-production-h3h4qv
        resourceGroupName: quotesapp-rg-production-h3h4qv
        appServiceSlot: production
        nodeVersion: 18.x
        workingDirectory: $(System.DefaultWorkingDirectory)/quotes-app/application
        environment: quotes-app-production
        healthCheckRetries: 10
        healthCheckDelay: 15
        runSmokeTests: true
        notifyOnFailure: true

stages:
  # ===================================================================
  # Development Environment
  # ===================================================================
  - stage: Build_Dev
    displayName: 'Build: Dev'
    condition: ne(variables['Build.Reason'], 'PullRequest')
    jobs:
      - template: ../../app_deployment_templates/build-app-service.yml
        parameters:
          environments: ${{ parameters.dev_env }}

  - stage: Deploy_Dev   
    displayName: 'Deploy: Dev'
    dependsOn: Build_Dev
    condition: succeeded()
    jobs:
      - template: ../../app_deployment_templates/deploy-app-service.yml
        parameters:
          environments: ${{ parameters.dev_env }}

  # ===================================================================
  # Production Environment
  # ===================================================================
  - stage: Build_Production
    displayName: 'Build: Production'
    dependsOn: Deploy_Dev
    condition: succeeded()
    jobs:
      - template: ../../app_deployment_templates/build-app-service.yml
        parameters:
          environments: ${{ parameters.prod_env }}

  - stage: Deploy_Production
    displayName: 'Deploy: Production'
    dependsOn: Build_Production
    condition: succeeded()
    jobs:
      - template: ../../app_deployment_templates/deploy-app-service.yml
        parameters:
          environments: ${{ parameters.prod_env }}