parameters:
  - name: environments
    type: object

jobs:
  - job: BackendStorage
    displayName: 'Verify Backend Storage'
    steps:
      - checkout: self

      - task: AzureCLI@2
        displayName: 'Check Storage Accounts'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            Write-Host "Verifying backend storage accounts..."
            Write-Host "Checking storage account: statefiletest001"
            Write-Host "Checking container: tfstate"
            Write-Host "Backend storage verification complete"
          addSpnToEnvironment: true
