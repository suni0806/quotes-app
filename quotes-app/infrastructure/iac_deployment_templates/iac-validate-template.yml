parameters:
  - name: env
    type: string
  - name: backendConfig
    type: string
  - name: varFile
    type: string
  - name: subscription
    type: string
  - name: tenantid
    type: string
  - name: cloud_provider
    type: string
  - name: appname
    type: string

jobs:
  - job: validate_${{ parameters.env }}
    displayName: 'Validate ${{ parameters.env }}'
    steps:
      - checkout: self

      - task: TerraformInstaller@0
        displayName: 'Install Terraform'
        inputs:
          terraformVersion: '1.5.0'

      - task: AzureCLI@2
        displayName: 'Terraform Init'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            $env:ARM_USE_OIDC = "true"
            $env:ARM_OIDC_TOKEN = $env:idToken
            $env:ARM_CLIENT_ID = $env:servicePrincipalId
            $env:ARM_TENANT_ID = $env:tenantId
            $env:ARM_SUBSCRIPTION_ID = (az account show --query id -o tsv)

            Set-Location quotes-app/infrastructure/platform
            terraform init ${{ parameters.backendConfig }}
          addSpnToEnvironment: true

      - task: AzureCLI@2
        name: outputVars
        displayName: 'Terraform Plan'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            $env:ARM_USE_OIDC = "true"
            $env:ARM_OIDC_TOKEN = $env:idToken
            $env:ARM_CLIENT_ID = $env:servicePrincipalId
            $env:ARM_TENANT_ID = $env:tenantId
            $env:ARM_SUBSCRIPTION_ID = (az account show --query id -o tsv)

            # Set variables via environment variables for robustness
            $env:TF_VAR_subscription_id = "${{ parameters.subscription }}"
            $env:TF_VAR_tenant_id = "${{ parameters.tenantid }}"

            Set-Location quotes-app/infrastructure/platform
            terraform plan ${{ parameters.varFile }} -out="${{ parameters.env }}.tfplan"
            
            Write-Host "##vso[task.setvariable variable=changeDetected;isOutput=true]true"
          addSpnToEnvironment: true

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Plan'
        inputs:
          targetPath: 'quotes-app/infrastructure/platform/${{ parameters.env }}.tfplan'
          artifact: 'tfplan-${{ parameters.env }}'
          publishLocation: 'pipeline'
