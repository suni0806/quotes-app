parameters:
  - name: environments
    type: object
  - name: appname
    type: string

jobs:
  - job: Build
    displayName: 'Build and Validate'
    steps:
      - checkout: self

      - task: TerraformInstaller@0
        displayName: 'Install Terraform'
        inputs:
          terraformVersion: '1.5.0'

      - task: AzureCLI@2
        displayName: 'Format Check'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            Write-Host "=========================================="
            Write-Host "  Building Infrastructure for: ${{ parameters.appname }}"
            Write-Host "=========================================="
            Set-Location quotes-app/infrastructure/platform
            terraform fmt -recursive


      - task: AzureCLI@2
        displayName: 'Validate Terraform'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            $env:ARM_USE_OIDC = "true"
            $env:ARM_OIDC_TOKEN = $env:idToken
            $env:ARM_CLIENT_ID = $env:servicePrincipalId
            $env:ARM_TENANT_ID = $env:tenantId
            $env:ARM_SUBSCRIPTION_ID = (az account show --query id -o tsv)

            Set-Location quotes-app/infrastructure/platform
            terraform init -backend=false
            terraform validate
          addSpnToEnvironment: true

      - task: AzureCLI@2
        name: backendoutputVars
        displayName: 'Set Output Variables'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            Write-Host "Build completed successfully"
            Write-Host "##vso[task.setvariable variable=backendchange;isOutput=true]true"
