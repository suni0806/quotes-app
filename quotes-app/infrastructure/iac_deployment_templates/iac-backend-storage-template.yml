parameters:
  - name: environments
    type: object

jobs:
  - job: BackendStorage
    displayName: 'Verify Backend Storage'
    steps:
      - checkout: self

      - task: AzureCLI@2
        displayName: 'Check Storage Accounts'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            $RESOURCE_GROUP = "statefile"
            $STORAGE_ACCOUNT = "statefiletest001"
            $CONTAINER = "tfstate"

            Write-Host "Verifying Storage Account: $STORAGE_ACCOUNT in Resource Group: $RESOURCE_GROUP"
            try {
              $account = az storage account show --name $STORAGE_ACCOUNT --resource-group $RESOURCE_GROUP --query id --output tsv 2>$null
              if (-not $account) {
                Write-Error "Storage Account '$STORAGE_ACCOUNT' not found!"
                exit 1
              }
              Write-Host "✅ Storage Account found."

              Write-Host "Verifying Container: $CONTAINER"
              # Verify container existence (assumes SPN has Data Contributor or similar role)
              $exists = az storage container exists --name $CONTAINER --account-name $STORAGE_ACCOUNT --auth-mode login --output tsv
              if ($exists -ne "True") {
                 Write-Error "Container '$CONTAINER' not found!"
                 exit 1
              }
              Write-Host "✅ Container found."
            } catch {
              Write-Error "Failed to verify backend storage: $_"
              exit 1
            }
          addSpnToEnvironment: true
