# ===================================================================
# Deploy Template for App Service Applications
# Version: 1.0.0
# Description: Deploys applications to Azure App Service with health checks
# ===================================================================

parameters:
  - name: environments
    type: object
    default: []

jobs:
  - ${{ each env in parameters.environments }}:
    - ${{ if or(eq(variables['Build.SourceBranch'], format('refs/heads/{0}', env.triggerBranch)), eq(variables['Build.Reason'], 'Manual')) }}:
      - deployment: Deploy_${{ env.name }}
        displayName: 'Deploy to ${{ env.name }}'
        timeoutInMinutes: ${{ env.timeoutInMinutes }}
        pool:
          name: 'test'
        environment: ${{ env.environment }}
        variables:
          imageTag: ${{ env.tagPrefix }}$(Build.BuildNumber)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Build Artifact'
                  inputs:
                    artifact: 'application-${{ env.name }}'
                    path: '$(Pipeline.Workspace)/drop'

                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service'
                  inputs:
                    azureSubscription: ${{ env.azureServiceConnection }}
                    appType: 'webAppLinux'
                    appName: ${{ env.appServiceName }}
                    deployToSlotOrASE: true
                    resourceGroupName: ${{ env.resourceGroupName }}
                    slotName: ${{ env.appServiceSlot }}
                    package: '$(Pipeline.Workspace)/drop/app-${{ env.name }}-$(imageTag).zip'
                    runtimeStack: 'NODE|18-lts'
                    startUpCommand: 'node server.js'

                - powershell: |
                    Write-Host "Waiting for application to start..."
                    Start-Sleep -Seconds ${{ env.healthCheckDelay }}
                  displayName: 'Wait for Deployment'
                  pwsh: true

                - powershell: |
                    $HEALTH_URL = "https://${{ env.appServiceName }}.azurewebsites.net/health"
                    Write-Host "Health Check: $HEALTH_URL"
                    
                    for ($i = 1; $i -le ${{ env.healthCheckRetries }}; $i++) {
                      try {
                        $response = Invoke-WebRequest -Uri $HEALTH_URL -UseBasicParsing -TimeoutSec 10
                        $STATUS = [int]$response.StatusCode
                        if ($STATUS -eq 200) {
                          Write-Host "✓ Health check passed (HTTP $STATUS)"
                          exit 0
                        }
                      } catch {
                        $STATUS = $_.Exception.Response.StatusCode.value__
                        if (!$STATUS) { $STATUS = "Error" }
                      }
                      Write-Host "Attempt $i/${{ env.healthCheckRetries }}: HTTP $STATUS, retrying in ${{ env.healthCheckDelay }}s..."
                      Start-Sleep -Seconds ${{ env.healthCheckDelay }}
                    }
                    
                    Write-Error "✗ Health check failed after ${{ env.healthCheckRetries }} attempts"
                    exit 1
                  displayName: 'Health Check'
                  pwsh: true

                - powershell: |
                    $QUOTE_URL = "https://${{ env.appServiceName }}.azurewebsites.net/api/quote"
                    Write-Host "API Smoke Test: $QUOTE_URL"
                    
                    try {
                      $response = Invoke-WebRequest -Uri $QUOTE_URL -UseBasicParsing
                      $content = $response.Content
                      if ($content -like "*quote*") {
                        Write-Host "✓ API smoke test passed"
                        Write-Host "Sample response: $($content.Substring(0, [Math]::Min(200, $content.Length)))"
                        exit 0
                      } else {
                        Write-Error "✗ API smoke test failed: Quote property not found"
                        Write-Host "Response: $content"
                        exit 1
                      }
                    } catch {
                      Write-Error "✗ API smoke test failed: $($_.Exception.Message)"
                      exit 1
                    }
                  displayName: 'API Smoke Test'
                  condition: and(succeeded(), eq('${{ env.runSmokeTests }}', 'true'))
                  pwsh: true

                - powershell: |
                    $STATS_URL = "https://${{ env.appServiceName }}.azurewebsites.net/api/stats"
                    Write-Host "Stats Check: $STATS_URL"
                    
                    try {
                      $response = Invoke-WebRequest -Uri $STATS_URL -UseBasicParsing
                      Write-Host "Database Stats: $($response.Content)"
                    } catch {
                      Write-Host "Warning: Could not fetch stats: $($_.Exception.Message)"
                    }
                  displayName: 'Database Stats Check'
                  condition: always()
                  continueOnError: true
                  pwsh: true
