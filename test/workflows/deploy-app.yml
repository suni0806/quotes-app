name: Deploy Application Only

on:
  push:
    branches:
      - main
    paths:
      - 'application/**'
      - '!application/scripts/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development

env:
  NODE_VERSION: '18.x'

jobs:
  # Build Application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './application/package-lock.json'

      - name: Install dependencies
        working-directory: ./application
        run: npm ci --production

      - name: Run linting
        working-directory: ./application
        run: npm run lint --if-present
        continue-on-error: true

      - name: Create deployment package
        run: |
          cd application
          # Exclude scripts folder and dev files from deployment
          zip -r ../app.zip . \
            -x "scripts/*" \
            -x "*.example" \
            -x ".env*" \
            -x "*.md" \
            -x "node_modules/.cache/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-package
          path: app.zip
          retention-days: 7

  # Deploy to Azure App Service
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: application-package

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get App Service Name
        id: get-app-name
        run: |
          if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            echo "app_name=${{ secrets.APP_SERVICE_NAME_STAGING }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.environment }}" == "development" ]; then
            echo "app_name=${{ secrets.APP_SERVICE_NAME_DEV }}" >> $GITHUB_OUTPUT
          else
            echo "app_name=${{ secrets.APP_SERVICE_NAME_PROD }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.get-app-name.outputs.app_name }}
          package: ./app.zip

      - name: Wait for deployment to complete
        run: sleep 30

      - name: Health Check
        run: |
          APP_NAME="${{ steps.get-app-name.outputs.app_name }}"
          HEALTH_URL="https://${APP_NAME}.azurewebsites.net/health"
          
          echo "Checking health endpoint: $HEALTH_URL"
          
          for i in {1..12}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL")
            if [ "$response" -eq 200 ]; then
              echo "✓ Health check passed! Application is running."
              exit 0
            fi
            echo "Attempt $i/12: Health check returned $response, retrying in 10s..."
            sleep 10
          done
          
          echo "✗ Health check failed after 12 attempts"
          exit 1

      - name: Test API endpoint
        run: |
          APP_NAME="${{ steps.get-app-name.outputs.app_name }}"
          API_URL="https://${APP_NAME}.azurewebsites.net/api/quote"
          
          echo "Testing API endpoint: $API_URL"
          
          response=$(curl -s "$API_URL")
          echo "API Response: $response"
          
          if echo "$response" | grep -q '"text"'; then
            echo "✓ API is working correctly"
          else
            echo "⚠ API response doesn't contain expected data"
            echo "This might indicate database is not seeded yet"
          fi

  # Notify deployment status
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
      - name: Deployment Success
        if: needs.deploy.result == 'success'
        run: |
          echo "🎉 Application deployment completed successfully!"
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
          
      - name: Deployment Failed
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Application deployment failed!"
          echo "Check logs for details"
          exit 1
