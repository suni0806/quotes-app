variables:
- name: app_name
  value: 'quotes_application'

parameters:
  - name: cloud_provider
    type: string
    default: 'azure'
  - name: template_version
    type: string
    default: v1.0.0
  - name: environments
    type: object
    default:

    - name: quotes_dev
      backendConfig: '--backend-config=environments/dev/backend.tfvars'
      varFile: '--var-file=environments/dev/variables.tfvars'
      subscription: '59533d6a-4284-4f40-8124-2b2dba74c4e0'
      tenantid: '64486216-28cf-43da-97ed-cfcb795b01ba'

    - name: quotes_production
      backendConfig: '--backend-config=environments/production/backend.tfvars'
      varFile: '--var-file=environments/production/variables.tfvars'
      subscription: '59533d6a-4284-4f40-8124-2b2dba74c4e0'
      tenantid: '64486216-28cf-43da-97ed-cfcb795b01ba'


trigger:
  branches:
    include:
      - main
  paths:
    include:
      - test/infrastructure

pr:
  branches:
    include:
    - main
  paths:
    include:
    - test/infrastructure

pool:
  name: 'test'  # Self-hosted agent pool - change this to match your pool name in Azure DevOps

stages:
  - stage: Build
    displayName: Build
    jobs:
    - template: ../templates/iac-build-template.yml
      parameters:
        environments: ${{ parameters.environments }}
        appname: '$(app_name)'

  - stage: Backend_Storage
    variables:
      bckndchangeVar: $[ dependencies.Build.outputs['Build.backendoutputVars.backendchange']]
    condition: and(succeeded('Build'), eq(variables['bckndchangeVar'], 'true'), not(canceled()) )
    displayName: Backend_Storage
    jobs:
    - template: ../templates/iac-backend-storage-template.yml
      parameters:
        environments: ${{ parameters.environments }}

  # Development Environment
  - stage: Validate_quotes_dev
    dependsOn: [Build, Backend_Storage]
    condition: and(succeeded('Build'), not(failed('Backend_Storage')), not(canceled()))
    displayName: Validate_quotes_dev
    jobs:
      - template: ../templates/iac-validate-template.yml
        parameters:
          env: 'quotes_dev'
          backendConfig: '--backend-config=environments/dev/backend.tfvars'
          varFile: '--var-file=environments/dev/variables.tfvars'
          subscription: '59533d6a-4284-4f40-8124-2b2dba74c4e0'
          tenantid: '64486216-28cf-43da-97ed-cfcb795b01ba'
          cloud_provider: '${{ parameters.cloud_provider }}'
          appname: '$(app_name)'

  - stage: DeployToquotes_dev
    dependsOn: Validate_quotes_dev
    displayName: DeployTo_quotes_dev
    variables:
      changeVar: $[ dependencies.Validate_quotes_dev.outputs['validate_quotes_dev.outputVars.changeDetected']]
    condition: and(succeeded('Validate_quotes_dev'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['changeVar'], 'true'))
    jobs:
      - template: ../templates/iac-deploy-template.yml
        parameters:
          env: 'quotes_dev'
          backendConfig: '--backend-config=environments/dev/backend.tfvars'
          varFile: '--var-file=environments/dev/variables.tfvars'
          subscription: '59533d6a-4284-4f40-8124-2b2dba74c4e0'
          tenantid: '64486216-28cf-43da-97ed-cfcb795b01ba'
          cloud_provider: '${{ parameters.cloud_provider }}'
          appname: '$(app_name)'

  # Production Environment
  - stage: Validate_quotes_production
    dependsOn: DeployToquotes_dev
    # Runs after Dev Deploy (even if Dev Deploy was skipped due to no changes)
    condition: and(not(failed('DeployToquotes_dev')), not(canceled()))
    displayName: Validate_quotes_production
    jobs:
      - template: ../templates/iac-validate-template.yml
        parameters:
          env: 'quotes_production'
          backendConfig: '--backend-config=environments/production/backend.tfvars'
          varFile: '--var-file=environments/production/variables.tfvars'
          subscription: '59533d6a-4284-4f40-8124-2b2dba74c4e0'
          tenantid: '64486216-28cf-43da-97ed-cfcb795b01ba'
          cloud_provider: '${{ parameters.cloud_provider }}'
          appname: '$(app_name)'

  - stage: DeployToquotes_production
    dependsOn: Validate_quotes_production
    displayName: DeployTo_quotes_production
    variables:
      changeVar: $[ dependencies.Validate_quotes_production.outputs['validate_quotes_production.outputVars.changeDetected']]
    condition: and(succeeded('Validate_quotes_production'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['changeVar'], 'true'))
    jobs:
      - template: ../templates/iac-deploy-template.yml
        parameters:
          env: 'quotes_production'
          backendConfig: '--backend-config=environments/production/backend.tfvars'
          varFile: '--var-file=environments/production/variables.tfvars'
          subscription: '59533d6a-4284-4f40-8124-2b2dba74c4e0'
          tenantid: '64486216-28cf-43da-97ed-cfcb795b01ba'
          cloud_provider: '${{ parameters.cloud_provider }}'
          appname: '$(app_name)'
