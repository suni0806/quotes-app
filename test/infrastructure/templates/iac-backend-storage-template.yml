parameters:
  - name: environments
    type: object

jobs:
  - job: BackendStorage
    displayName: 'Verify Backend Storage'
    steps:
      - checkout: self

      - task: AzureCLI@2
        displayName: 'Check Storage Accounts'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            echo "Verifying backend storage accounts..."
            echo "Checking storage account: statefiletest001"
            echo "Checking container: tfstate"
            echo "Backend storage verification complete"
          addSpnToEnvironment: true
