parameters:
  - name: environments
    type: object

jobs:
  - job: BackendStorage
    displayName: 'Verify Backend Storage'
    steps:
      - checkout: self

      - script: |
          echo "Verifying backend storage accounts..."
          echo "Checking storage account: statefiletest001"
          call az storage account show --name statefiletest001 --resource-group rg-terraform-state
          echo "Backend storage verification complete"
        displayName: 'Check Storage Accounts (CMD)'
