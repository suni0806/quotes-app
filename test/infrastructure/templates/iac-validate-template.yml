parameters:
  - name: env
    type: string
  - name: backendConfig
    type: string
  - name: varFile
    type: string
  - name: subscription
    type: string
  - name: tenantid
    type: string
  - name: cloud_provider
    type: string
  - name: appname
    type: string

jobs:
  - job: validate_${{ parameters.env }}
    displayName: 'Validate ${{ parameters.env }}'
    steps:
      - checkout: self

      - task: TerraformInstaller@0
        displayName: 'Install Terraform'
        inputs:
          terraformVersion: '1.5.0'

      - task: AzureCLI@2
        displayName: 'Terraform Init'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            $env:ARM_USE_OIDC = "true"
            $env:ARM_OIDC_TOKEN = $env:idToken
            $env:ARM_CLIENT_ID = $env:servicePrincipalId
            $env:ARM_TENANT_ID = $env:tenantId

            Set-Location test/infrastructure/platform
            terraform init ${{ parameters.backendConfig }}
          addSpnToEnvironment: true

      - task: AzureCLI@2
        displayName: 'Terraform Plan'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            $env:ARM_USE_OIDC = "true"
            $env:ARM_OIDC_TOKEN = $env:idToken
            $env:ARM_CLIENT_ID = $env:servicePrincipalId
            $env:ARM_TENANT_ID = $env:tenantId

            Set-Location test/infrastructure/platform
            terraform plan ${{ parameters.varFile }} `
              -var="subscription_id=${{ parameters.subscription }}" `
              -var="tenant_id=${{ parameters.tenantid }}" `
              -var="sql_admin_password=$(SQL_ADMIN_PASSWORD)" `
              -out=${{ parameters.env }}.tfplan
            
            Write-Host "##vso[task.setvariable variable=changeDetected;isOutput=true]true"
          addSpnToEnvironment: true
        env:
          SQL_ADMIN_PASSWORD: $(SQL_ADMIN_PASSWORD)

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Plan'
        inputs:
          targetPath: 'infrastructure/platform/${{ parameters.env }}.tfplan'
          artifact: 'tfplan-${{ parameters.env }}'
          publishLocation: 'pipeline'
