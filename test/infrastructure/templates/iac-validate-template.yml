parameters:
  - name: env
    type: string
  - name: backendConfig
    type: string
  - name: varFile
    type: string
  - name: subscription
    type: string
  - name: tenantid
    type: string
  - name: cloud_provider
    type: string
  - name: appname
    type: string

jobs:
  - job: validate_${{ parameters.env }}
    displayName: 'Validate ${{ parameters.env }}'
    steps:
      - checkout: self

      - task: TerraformInstaller@0
        displayName: 'Install Terraform'
        inputs:
          terraformVersion: '1.5.0'

      - task: AzurePowerShell@5
        displayName: 'Terraform Init'
        inputs:
          azureSubscription: 'sc-1'
          ScriptType: 'InlineScript'
          Inline: |
            $token = Get-AzAccessToken -ResourceUrl "https://management.azure.com/"
            $env:ARM_ACCESS_TOKEN = $token.Token
            $env:ARM_SUBSCRIPTION_ID = (Get-AzContext).Subscription.Id
            $env:ARM_TENANT_ID = (Get-AzContext).Tenant.Id
            $env:ARM_CLIENT_ID = (Get-AzContext).Account.Id 
            
            Set-Location test/infrastructure/platform
            terraform init ${{ parameters.backendConfig }}
          azurePowerShellVersion: 'LatestVersion'
          pwsh: true

      - task: AzurePowerShell@5
        displayName: 'Terraform Plan'
        inputs:
          azureSubscription: 'sc-1'
          ScriptType: 'InlineScript'
          Inline: |
            $token = Get-AzAccessToken -ResourceUrl "https://management.azure.com/"
            $env:ARM_ACCESS_TOKEN = $token.Token
            $env:ARM_SUBSCRIPTION_ID = (Get-AzContext).Subscription.Id
            $env:ARM_TENANT_ID = (Get-AzContext).Tenant.Id
            $env:ARM_CLIENT_ID = (Get-AzContext).Account.Id

            Set-Location test/infrastructure/platform
            terraform plan ${{ parameters.varFile }} `
              -var="subscription_id=${{ parameters.subscription }}" `
              -var="tenant_id=${{ parameters.tenantid }}" `
              -var="sql_admin_password=$(SQL_ADMIN_PASSWORD)" `
              -out=${{ parameters.env }}.tfplan
            
            Write-Host "##vso[task.setvariable variable=changeDetected;isOutput=true]true"
          azurePowerShellVersion: 'LatestVersion'
          pwsh: true
        env:
          SQL_ADMIN_PASSWORD: $(SQL_ADMIN_PASSWORD)

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Plan'
        inputs:
          targetPath: 'infrastructure/platform/${{ parameters.env }}.tfplan'
          artifact: 'tfplan-${{ parameters.env }}'
          publishLocation: 'pipeline'
