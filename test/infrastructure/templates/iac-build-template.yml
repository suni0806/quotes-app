parameters:
  - name: environments
    type: object
  - name: appname
    type: string

jobs:
  - job: Build
    displayName: 'Build and Validate'
    steps:
      - checkout: self

      - task: TerraformInstaller@0
        displayName: 'Install Terraform'
        inputs:
          terraformVersion: '1.5.0'

      - task: AzureCLI@2
        displayName: 'Format Check'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            Write-Host "=========================================="
            Write-Host "  Building Infrastructure for: ${{ parameters.appname }}"
            Write-Host "=========================================="
            Set-Location test/infrastructure/platform
            terraform fmt -check -recursive
        continueOnError: true

      - task: AzureCLI@2
        displayName: 'Validate Terraform'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            Set-Location test/infrastructure/platform
            terraform init -backend=false
            terraform validate

      - task: AzureCLI@2
        name: backendoutputVars
        displayName: 'Set Output Variables'
        inputs:
          azureSubscription: 'sc-1'
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          inlineScript: |
            Write-Host "Build completed successfully"
            Write-Host "##vso[task.setvariable variable=backendchange;isOutput=true]true"
