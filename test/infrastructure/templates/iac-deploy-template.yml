parameters:
  - name: env
    type: string
  - name: backendConfig
    type: string
  - name: varFile
    type: string
  - name: subscription
    type: string
  - name: tenantid
    type: string
  - name: cloud_provider
    type: string
  - name: appname
    type: string

jobs:
  - deployment: deploy_${{ parameters.env }}
    displayName: 'Deploy to ${{ parameters.env }}'
    environment: 'infrastructure-${{ parameters.env }}'
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: TerraformInstaller@0
              displayName: 'Install Terraform'
              inputs:
                terraformVersion: '1.5.0'

            - task: DownloadPipelineArtifact@2
              displayName: 'Download Plan'
              inputs:
                artifact: 'tfplan-${{ parameters.env }}'
                path: 'infrastructure/platform'

            - script: |
                echo "Setting subscription..."
                call az account set --subscription ${{ parameters.subscription }}

                cd test/infrastructure/platform
                echo "Running Terraform Init..."
                call terraform init ${{ parameters.backendConfig }}
              displayName: 'Terraform Init (CMD)'

            - script: |
                cd test/infrastructure/platform
                echo "Running Terraform Apply..."
                call terraform apply -auto-approve ${{ parameters.env }}.tfplan
              displayName: 'Terraform Apply (CMD)'

            - task: PowerShell@2
              displayName: 'Deployment Summary'
              inputs:
                targetType: 'inline'
                script: |
                  Write-Host "=========================================="
                  Write-Host "  Deployment Summary"
                  Write-Host "=========================================="
                  Write-Host "Environment: ${{ parameters.env }}"
                  Write-Host "Application: ${{ parameters.appname }}"
                  Write-Host "Subscription: ${{ parameters.subscription }}"
                  Write-Host "=========================================="
                pwsh: true
