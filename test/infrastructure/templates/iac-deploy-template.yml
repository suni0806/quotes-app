parameters:
  - name: env
    type: string
  - name: backendConfig
    type: string
  - name: varFile
    type: string
  - name: subscription
    type: string
  - name: tenantid
    type: string
  - name: cloud_provider
    type: string
  - name: appname
    type: string

jobs:
  - deployment: deploy_${{ parameters.env }}
    displayName: 'Deploy to ${{ parameters.env }}'
    environment: 'infrastructure-${{ parameters.env }}'
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: TerraformInstaller@0
              displayName: 'Install Terraform'
              inputs:
                terraformVersion: '1.5.0'

            - task: DownloadPipelineArtifact@2
              displayName: 'Download Plan'
              inputs:
                artifact: 'tfplan-${{ parameters.env }}'
                path: 'test/infrastructure/platform'

            - task: AzureCLI@2
              displayName: 'Terraform Init'
              inputs:
                azureSubscription: 'sc-1'
                scriptType: 'pscore'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  $env:ARM_USE_OIDC = "true"
                  $env:ARM_OIDC_TOKEN = $env:idToken
                  $env:ARM_CLIENT_ID = $env:servicePrincipalId
                  $env:ARM_TENANT_ID = $env:tenantId
                  $env:ARM_SUBSCRIPTION_ID = (az account show --query id -o tsv)

                  Set-Location test/infrastructure/platform
                  terraform init ${{ parameters.backendConfig }}
                addSpnToEnvironment: true

            - task: AzureCLI@2
              displayName: 'Terraform Apply'
              inputs:
                azureSubscription: 'sc-1'
                scriptType: 'pscore'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  $env:ARM_USE_OIDC = "true"
                  $env:ARM_OIDC_TOKEN = $env:idToken
                  $env:ARM_CLIENT_ID = $env:servicePrincipalId
                  $env:ARM_TENANT_ID = $env:tenantId
                  $env:ARM_SUBSCRIPTION_ID = (az account show --query id -o tsv)

                  Set-Location test/infrastructure/platform
                  terraform apply -auto-approve ${{ parameters.env }}.tfplan
                  
                  # Capture outputs for next step
                  $outputs = terraform output -json | ConvertFrom-Json
                  Write-Host "##vso[task.setvariable variable=SQL_SERVER_FQDN]$($outputs.sql_server_fqdn.value)"
                  Write-Host "##vso[task.setvariable variable=SQL_DATABASE_NAME]$($outputs.sql_database_name.value)"
                  Write-Host "##vso[task.setvariable variable=APP_SERVICE_NAME]$($outputs.app_service_name.value)"
                  Write-Host "##vso[task.setvariable variable=SQL_SERVER_NAME]$($outputs.sql_server_name.value)"
                  Write-Host "##vso[task.setvariable variable=RESOURCE_GROUP_NAME]${{ parameters.appname }}-rg-${{ parameters.env }}-h3h4qv"
                addSpnToEnvironment: true

            - task: AzureCLI@2
              displayName: 'Grant SQL Permissions'
              inputs:
                azureSubscription: 'sc-1'
                scriptType: 'pscore'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  $agentIp = (Invoke-RestMethod -Uri "https://api.ipify.org").Trim()
                  Write-Host "Build Agent IP: $agentIp"
                  
                  $rg = "$(RESOURCE_GROUP_NAME)"
                  $server = "$(SQL_SERVER_NAME)"
                  
                  Write-Host "Adding temporary firewall rule..."
                  az sql server firewall-rule create --resource-group $rg --server $server --name "AllowAgentIP" --start-ip-address $agentIp --end-ip-address $agentIp
                  
                  try {
                    Set-Location test/infrastructure/scripts
                    .\grant-sql-permissions.ps1 -Server "$(SQL_SERVER_FQDN)" -Database "$(SQL_DATABASE_NAME)" -ManagedIdentityName "$(APP_SERVICE_NAME)"
                  } finally {
                    Write-Host "Removing temporary firewall rule..."
                    az sql server firewall-rule delete --resource-group $rg --server $server --name "AllowAgentIP"
                  }
                addSpnToEnvironment: true

            - task: AzureCLI@2
              displayName: 'Deployment Summary'
              inputs:
                azureSubscription: 'sc-1'
                scriptType: 'pscore'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  Write-Host "=========================================="
                  Write-Host "  Deployment Summary"
                  Write-Host "=========================================="
                  Write-Host "Environment: ${{ parameters.env }}"
                  Write-Host "Application: ${{ parameters.appname }}"
                  Write-Host "Subscription: ${{ parameters.subscription }}"
                  Write-Host "=========================================="
