name: '$(Rev:r)'

variables:
  tag: $(Build.BuildNumber)

parameters:
  - name: environments
    type: object
    default:
      - name: dev
        timeoutInMinutes: 30
        triggerBranch: dev
        tagPrefix: "1.0."
        azureServiceConnection: azure-quotes-app-dev-sc
        appServiceName: app-quotes-random-dev
        appServiceSlot: production
        nodeVersion: 18.x
        workingDirectory: $(System.DefaultWorkingDirectory)/application
        environment: quotes-app-dev
        healthCheckRetries: 5
        healthCheckDelay: 10
        runSmokeTests: true
        notifyOnFailure: true

      - name: staging
        timeoutInMinutes: 30
        triggerBranch: staging
        tagPrefix: "1.0."
        azureServiceConnection: azure-quotes-app-staging-sc
        appServiceName: app-quotes-random-staging
        appServiceSlot: production
        nodeVersion: 18.x
        workingDirectory: $(System.DefaultWorkingDirectory)/application
        environment: quotes-app-staging
        healthCheckRetries: 5
        healthCheckDelay: 10
        runSmokeTests: true
        notifyOnFailure: true

      - name: production
        timeoutInMinutes: 30
        triggerBranch: main
        tagPrefix: "1.0."
        azureServiceConnection: azure-quotes-app-prod-sc
        appServiceName: app-quotes-random-prod
        appServiceSlot: production
        nodeVersion: 18.x
        workingDirectory: $(System.DefaultWorkingDirectory)/application
        environment: quotes-app-production
        healthCheckRetries: 10
        healthCheckDelay: 15
        runSmokeTests: true
        notifyOnFailure: true

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
    - repository: quotes-app
      type: github
      name: YourOrg/quotes-random-app
      endpoint: YourGitHubConnection
      trigger:
        batch: true
        branches:
          include:
            - dev
            - staging
            - main
        paths:
          include:
            - application/**
      pr:
        branches:
          include:
            - dev
            - staging
            - main
        paths:
          include:
            - application/**

stages:
  # ===================================================================
  # Build Stage
  # ===================================================================
  - stage: Build
    displayName: 'Build Application'
    condition: ne(variables['Build.Reason'], 'PullRequest')
    jobs:
      - template: ../../app_deployment_templates/build-app-service.yml
        parameters:
          environments: ${{ parameters.environments }}

  # ===================================================================
  # Deploy Stage
  # ===================================================================
  - stage: Deploy   
    displayName: 'Deploy Application'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - template: ../../app_deployment_templates/deploy-app-service.yml
        parameters:
          environments: ${{ parameters.environments }}

  # ===================================================================
  # Summary Stage
  # ===================================================================
  - stage: Summary
    displayName: 'Deployment Summary'
    dependsOn: Deploy
    condition: always()
    jobs:
      - template: ../../app_deployment_templates/summary-app-service.yml
        parameters:
          environments: ${{ parameters.environments }}
