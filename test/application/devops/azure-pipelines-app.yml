name: '$(Rev:r)'

variables:
  tag: $(Build.BuildNumber)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - test/application/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - test/application/**

parameters:
  - name: environments
    type: object
    default:
      - name: dev
        timeoutInMinutes: 30
        triggerBranch: main
        tagPrefix: "1.0."
        azureServiceConnection: sc-1
        appServiceName: quotesapp-appsvc-dev-h3h4qv
        appServiceSlot: production
        nodeVersion: 18.x
        workingDirectory: $(System.DefaultWorkingDirectory)/test/application
        environment: quotes-app-dev
        healthCheckRetries: 5
        healthCheckDelay: 10
        runSmokeTests: true
        notifyOnFailure: true

      - name: production
        timeoutInMinutes: 30
        triggerBranch: main
        tagPrefix: "1.0."
        azureServiceConnection: sc-1
        appServiceName: quotesapp-appsvc-production-h3h4qv
        appServiceSlot: production
        nodeVersion: 18.x
        workingDirectory: $(System.DefaultWorkingDirectory)/test/application
        environment: quotes-app-production
        healthCheckRetries: 10
        healthCheckDelay: 15
        runSmokeTests: true
        notifyOnFailure: true

pool:
  vmImage: 'ubuntu-latest'


stages:
  # ===================================================================
  # Build Stage
  # ===================================================================
  - stage: Build
    displayName: 'Build Application'
    condition: ne(variables['Build.Reason'], 'PullRequest')
    jobs:
      - template: ../../app_deployment_templates/build-app-service.yml
        parameters:
          environments: ${{ parameters.environments }}

  # ===================================================================
  # Deploy Stage
  # ===================================================================
  - stage: Deploy   
    displayName: 'Deploy Application'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - template: ../../app_deployment_templates/deploy-app-service.yml
        parameters:
          environments: ${{ parameters.environments }}

  # ===================================================================
  # Summary Stage
  # ===================================================================
  - stage: Summary
    displayName: 'Deployment Summary'
    dependsOn: Deploy
    condition: always()
    jobs:
      - template: ../../app_deployment_templates/summary-app-service.yml
        parameters:
          environments: ${{ parameters.environments }}
